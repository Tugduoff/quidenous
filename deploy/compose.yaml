services:
  quidenous:
    build:
      context: ..
      # Shown by /api/version (deploy.sh sets them; a plain `docker compose build` says "dev").
      args:
        VERSION: ${QD_VERSION:-dev}
        GIT_SHA: ${QD_GIT_SHA:-dev}
    image: quidenous:latest
    container_name: quidenous
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
