services:
  quidenous:
    build:
      context: ..
      args:
        VERSION: ${QD_VERSION:-}
        GIT_SHA: ${QD_GIT_SHA:-}
    image: quidenous:latest
    init: true
    container_name: quidenous
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
