services:
  quidenous:
    build:
      context: ..
      # Shown by /api/version (deploy.sh sets them; a plain `docker compose build` reports app.json's version and
      # sha "dev").
      args:
        VERSION: ${QD_VERSION:-}
        GIT_SHA: ${QD_GIT_SHA:-}
    image: quidenous:latest
    # A real PID 1 (docker-init) passes SIGTERM on, so `docker stop` lets requests finish (graceful shutdown).
    init: true
    container_name: quidenous
    restart: unless-stopped
    env_file: .env
    # Size-capped logs, as the privacy policy says: 3 files of 10 MB, the oldest dropped.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8080:8080"
