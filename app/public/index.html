<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="qui de nous ?" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F5F0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E12" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="no-focus-box">
      /* Text fields live inside rounded cards: the browser's square focus box breaks the design. */
      input:focus,
      textarea:focus {
        outline: none;
      }
    </style>
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #F5F5F0;
      }
      /* Until the app sets the colors of the theme chosen in it. */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0E0E12;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // The theme chosen in the app (if any) colours the page before the app loads: no light flash on a dark choice.
      try {
        var pref = localStorage.getItem('qdn.theme');
        if (pref === 'dark' || pref === 'light') {
          var bg = pref === 'dark' ? '#0E0E12' : '#F5F5F0';
          var style = document.createElement('style');
          style.textContent = 'html, body { background-color: ' + bg + '; }';
          document.head.appendChild(style);
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', bg); });
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
