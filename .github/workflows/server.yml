name: server
on:
  # Pushes to main and tags only: a branch with a PR is already checked by pull_request (no double run).
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", "app/**", "Dockerfile", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "app/**", "Dockerfile", ".github/workflows/server.yml"]
  # Weekly `audit` on main (new RustSec advisories show up without a push); `check` doesn't run on the schedule.
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  # The weekly audit has its own group: it must not cancel (or be cancelled by) a push to main.
  group: server-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  # A newer push supersedes a running check; tag runs always finish (deploys wait for them, deploy/wait-green.sh).
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  check:
    # Not on the weekly schedule (audit only). That skipped run's `check` doesn't count for deploy/wait-green.sh.
    if: github.event_name != 'schedule'
    # Tug's Mac only for pushes and PRs from this repo: the repo is public, and a PR from a fork must never run
    # code (build scripts, tests) on a self-hosted machine. Forks always build on GitHub's Ubuntu.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.QDN_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned (same as the Dockerfile's rust image): a new stable with new clippy lints can't turn this red by itself.
      # Bump both together.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Docker only on GitHub's Ubuntu (the Mac runner has no Docker).
      - run: docker build -t quidenous ..
        if: runner.os == 'Linux'
  # Known vulnerabilities in the dependencies (RustSec), on every run and weekly. Not a required check: a new advisory
  # shows up here without blocking unrelated PRs. Ignored advisories, with the reason: server/.cargo/audit.toml.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.99.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23-${{ runner.os }}
      - run: command -v cargo-audit || cargo install cargo-audit --locked --version ^0.23
      - run: cargo audit
