name: server
on:
  push:
    paths: ["server/**", "app/**", "Dockerfile", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "app/**", "Dockerfile", ".github/workflows/server.yml"]
jobs:
  check:
    runs-on: ${{ fromJSON(vars.QDN_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      # Docker only on GitHub's Ubuntu (the Mac runner has no Docker).
      - run: docker build -t quidenous ..
        if: runner.os == 'Linux'
