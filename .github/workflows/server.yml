name: server
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", "app/**", "deploy/**", "scripts/**", "check", "Dockerfile", ".github/**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
concurrency:
  group: server-${{ github.event_name == 'schedule' && 'schedule' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            server:
              - "server/**"
              - "app/**"
              - "deploy/**"
              - "scripts/**"
              - "check"
              - "Dockerfile"
              - ".github/**"
  check:
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ${{ needs.changes.outputs.server != 'false' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.QDN_RUNNER || '"ubuntu-latest"') || 'ubuntu-latest' }}
    steps:
      - name: Nothing to check (this required job reports success, it is never skipped)
        if: needs.changes.outputs.server == 'false'
        run: 'echo "::notice::No change that the server checks depend on: nothing to check."'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.server != 'false'
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        if: needs.changes.outputs.server != 'false'
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.server != 'false'
        with:
          workspaces: server
      - run: ./check repo
        if: needs.changes.outputs.server != 'false'
      - run: ./check server
        if: needs.changes.outputs.server != 'false'
      - name: Docker image builds (GitHub runners only, the Mac runner has no Docker)
        run: docker build -t quidenous .
        if: needs.changes.outputs.server != 'false' && runner.os == 'Linux'
  audit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.server != 'false' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master 2026-11-15
        with:
          toolchain: 1.99.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.23-${{ runner.os }}
      - run: command -v cargo-audit || cargo install cargo-audit --locked --version ^0.23
      - run: cargo audit
