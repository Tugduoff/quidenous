name: android
on:
  workflow_dispatch:
    inputs:
      gate:
        description: Run the release gate like a tag build (waits up to 90 min for check and app on this commit)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/android.yml"]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  apk:
    runs-on: ${{ fromJSON(vars.QDN_RUNNER || '"ubuntu-latest"') }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: runner.os == 'macOS'
        with:
          packages: platform-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_PUBLIC_DISTRIBUTION: sideload
      - run: echo "EXPO_PUBLIC_API_URL=https://qdn.coflop.fr" >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        working-directory: app/android
        env:
          EXPO_PUBLIC_DISTRIBUTION: sideload
      - name: APK can update itself
        run: unzip -p app/build/outputs/apk/release/app-release.apk AndroidManifest.xml | LC_ALL=C tr -d '\0' | LC_ALL=C grep -c REQUEST_INSTALL_PACKAGES >/dev/null
        working-directory: app/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quidenous-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
      - name: Play upload signing
        if: env.UPLOAD_B64 != ''
        env:
          UPLOAD_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$UPLOAD_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          cat >> app/build.gradle <<'GRADLE'

          if (project.hasProperty('playUpload')) {
              android {
                  signingConfigs {
                      upload {
                          storeFile file(System.getenv('UPLOAD_STORE_FILE'))
                          storeType 'pkcs12'
                          storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                          keyAlias 'upload'
                          keyPassword System.getenv('UPLOAD_STORE_PASSWORD')
                      }
                  }
                  buildTypes { release { signingConfig signingConfigs.upload } }
              }
          }
          GRADLE
        working-directory: app/android
      - name: Play bundle (AAB)
        if: hashFiles('app/android/app/build.gradle') != ''
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.p12
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          [ -f "$UPLOAD_STORE_FILE" ] || { echo "no upload key, skipping"; exit 0; }
          sed -i.bak '/android.permission.REQUEST_INSTALL_PACKAGES/d' app/src/main/AndroidManifest.xml && rm app/src/main/AndroidManifest.xml.bak
          rm -rf "${TMPDIR:-/tmp}"/metro-* "${TMPDIR:-/tmp}"/haste-map-*
          ./gradlew createReleaseUpdatesResources --rerun createBundleReleaseJsAndAssets --rerun bundleRelease -PplayUpload -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
          if unzip -p app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml | LC_ALL=C tr -d '\0' | LC_ALL=C grep -c REQUEST_INSTALL_PACKAGES >/dev/null; then
            echo "::error::REQUEST_INSTALL_PACKAGES must not be in the Play bundle"; exit 1
          fi
          for p in RECORD_AUDIO SYSTEM_ALERT_WINDOW READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE; do
            if unzip -p app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml | tr -d '\0' | grep -c "android.permission.$p" >/dev/null; then
              echo "::error::$p must not be in the Play bundle"; exit 1
            fi
          done
        working-directory: app/android
      - name: Remove the upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('app/android/app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: quidenous-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
      - name: OTA runtimes
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          commit_time() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(new Date(JSON.parse(s).commitTime).toISOString()))'; }
          echo "OTA_APK_RUNTIME=$(unzip -p $apk assets/fingerprint)" >> "$GITHUB_ENV"
          echo "OTA_APK_TIME=$(unzip -p $apk assets/app.manifest | commit_time)" >> "$GITHUB_ENV"
          if [ -f $aab ]; then
            echo "OTA_AAB_RUNTIME=$(unzip -p $aab base/assets/fingerprint)" >> "$GITHUB_ENV"
            echo "OTA_AAB_TIME=$(unzip -p $aab base/assets/app.manifest | commit_time)" >> "$GITHUB_ENV"
            [ "$(unzip -p $apk assets/fingerprint)" != "$(unzip -p $aab base/assets/fingerprint)" ] || { echo "::error::APK and AAB share a runtime"; exit 1; }
          fi
          cat "$GITHUB_ENV" | grep OTA_
        working-directory: app/android
      - name: OTA bundles
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.OTA_APK_RUNTIME != ''
        run: |
          export_ota() {
            npx expo export --platform android --clear --output-dir "ota/$1"
            npx expo config --json --type public > "ota/$1/expo-config.json"
            printf '%s\n%s\n' "$2" "$3" > "ota/$1/runtime"
          }
          EXPO_PUBLIC_DISTRIBUTION=sideload export_ota apk "$OTA_APK_RUNTIME" "$OTA_APK_TIME"
          [ -z "$OTA_AAB_RUNTIME" ] || export_ota play "$OTA_AAB_RUNTIME" "$OTA_AAB_TIME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('app/ota/apk/runtime') != ''
        with:
          name: ota-bundles
          path: app/ota/
          retention-days: 7
      - name: Clean up secrets (self-hosted)
        if: always() && runner.environment == 'self-hosted'
        run: rm -f app/google-services.json app/android/app/google-services.json "$RUNNER_TEMP"/upload.p12
        working-directory: ${{ github.workspace }}
  gate:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: deploy
      - name: check and app green on this commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECKS: check app
          GATED: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.gate) && '1' || '' }}
        run: |
          if [ -z "$GATED" ]; then
            deploy/wait-green.sh "$GITHUB_SHA" || echo "::notice::not gated (manual run): a tag build would wait for check and app"
            exit 0
          fi
          rc=0
          deploy/wait-green.sh "$GITHUB_SHA" --wait 5400 || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error title=Release gate::check or app failed on $GITHUB_SHA: no OTA update. Re-run the failed job then this run's failed jobs, or push a new tag"; exit 1 ;;
            *) echo "::error title=Release gate::check and app not green on $GITHUB_SHA after 90 min: re-run this run's failed jobs once they are"; exit 1 ;;
          esac
  ota:
    needs: [apk, gate]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment: ota
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: app/scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ota-bundles
          path: app/ota
      - name: Production runs this tag
        id: prod
        if: startsWith(github.ref, 'refs/tags/v') || inputs.gate
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
        run: |
          if [ -n "$TAG" ]; then want="${GITHUB_REF_NAME#v}"; wait=5400; else want=$(jq -r .version ota/apk/expo-config.json); wait=0; fi
          deadline=$(($(date +%s) + wait))
          while :; do
            body=$(curl -fsS -m 10 https://qdn.coflop.fr/api/version 2>/dev/null || true)
            version=$(jq -r '.version // empty' <<<"$body" 2>/dev/null || true)
            sha=$(jq -r '.sha // empty' <<<"$body" 2>/dev/null || true)
            if [ "$version" = "$want" ] || { [[ "$sha" =~ ^[0-9a-f]{7,40}$ ]] && [[ "$GITHUB_SHA" == "$sha"* ]]; }; then
              echo "production runs $want (${sha:-?})"
              exit 0
            fi
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "$(printf '%s\n%s\n' "$want" "$version" | sort -V | tail -n1)" = "$version" ]; then
              echo "::notice title=OTA update not published::production already runs $version, newer than $want: superseded"
              if [ -n "$TAG" ]; then echo "superseded=1" >>"$GITHUB_OUTPUT"; fi
              exit 0
            fi
            echo "production runs ${version:-?} (${sha:-?}), waiting for $want"
            [ "$(date +%s)" -lt "$deadline" ] || break
            sleep 30
          done
          if [ -z "$TAG" ]; then echo "::notice::manual run: a tag build would wait for production to run $want"; exit 0; fi
          echo "::error title=OTA update not published::production doesn't run $want after 90 min: re-run this job once it does (GET https://qdn.coflop.fr/api/version)"
          exit 1
      - name: Publish
        if: steps.prod.outputs.superseded != '1'
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '' }}
          UPDATES_PUBLISH_TOKEN: ${{ secrets.UPDATES_PUBLISH_TOKEN }}
          UPDATES_PRIVATE_KEY: ${{ secrets.UPDATES_PRIVATE_KEY }}
        run: |
          if [ -n "$TAG" ] && [ -z "$UPDATES_PUBLISH_TOKEN" ]; then echo "::error::UPDATES_PUBLISH_TOKEN is not set"; exit 1; fi
          for build in apk play; do
            [ -f "ota/$build/runtime" ] || continue
            { read -r runtime; read -r created; } < "ota/$build/runtime"
            out=(); [ -n "$TAG" ] || out=(--out "$RUNNER_TEMP/ota-$build.tar.gz")
            if ! node scripts/ota-publish.mjs --dist "ota/$build" --runtime "$runtime" --created-at "$created" --expo-config "ota/$build/expo-config.json" "${out[@]}"; then
              echo "::error title=OTA update not published::$build ($runtime): phones on this build get no update until the next tag"
              failed=1
            fi
          done
          exit "${failed:-0}"
