name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Path filters don't apply to tags: every v* tag builds, and only tag builds publish OTA updates, because
    # production deploys the latest v* tag (not main). JS on main may call server routes prod doesn't have yet.
    tags: ["v*"]
    paths: ["app/**", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # The APK (installed by hand) updates itself from GitHub Releases: EXPO_PUBLIC_DISTRIBUTION=sideload turns that on
      # and app.config.ts adds REQUEST_INSTALL_PACKAGES. The Play bundle below is built without either (Play policy).
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
          EXPO_PUBLIC_DISTRIBUTION: sideload
      - run: echo "EXPO_PUBLIC_API_URL=https://qdn.coflop.fr" >> "$GITHUB_ENV"
      - run: echo "EXPO_PUBLIC_JOIN_CODE=$JOIN_CODE" >> "$GITHUB_ENV"
        env:
          JOIN_CODE: ${{ secrets.JOIN_CODE }}
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        working-directory: app/android
        env:
          EXPO_PUBLIC_DISTRIBUTION: sideload
      - name: APK can update itself
        run: unzip -p app/build/outputs/apk/release/app-release.apk AndroidManifest.xml | tr -d '\0' | grep -c REQUEST_INSTALL_PACKAGES >/dev/null
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: quidenous-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
      # Google Play: an app bundle signed with the upload key (the APK above keeps its old key,
      # so the APKs people installed by hand still update in place).
      - name: Play upload signing
        if: env.UPLOAD_B64 != ''
        env:
          UPLOAD_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$UPLOAD_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          cat >> app/build.gradle <<'GRADLE'

          // Added by CI for the Play bundle only (-PplayUpload).
          if (project.hasProperty('playUpload')) {
              android {
                  signingConfigs {
                      upload {
                          storeFile file(System.getenv('UPLOAD_STORE_FILE'))
                          storeType 'pkcs12'
                          storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                          keyAlias 'upload'
                          keyPassword System.getenv('UPLOAD_STORE_PASSWORD')
                      }
                  }
                  buildTypes { release { signingConfig signingConfigs.upload } }
              }
          }
          GRADLE
        working-directory: app/android
      - name: Play bundle (AAB)
        if: hashFiles('app/android/app/build.gradle') != ''
        env:
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.p12
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          [ -f "$UPLOAD_STORE_FILE" ] || { echo "no upload key, skipping"; exit 0; }
          # No self-update on Google Play: drop the install permission and rebuild the JS without the sideload flag
          # (fresh Metro cache, JS bundle task forced to run again).
          sed -i '/android.permission.REQUEST_INSTALL_PACKAGES/d' app/src/main/AndroidManifest.xml
          rm -rf "${TMPDIR:-/tmp}"/metro-* "${TMPDIR:-/tmp}"/haste-map-*
          # expo-updates' resources (runtime fingerprint, embedded manifest) depend on the app config too: redo them.
          ./gradlew createReleaseUpdatesResources --rerun createBundleReleaseJsAndAssets --rerun bundleRelease -PplayUpload -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
          if unzip -p app/build/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml | tr -d '\0' | grep -c REQUEST_INSTALL_PACKAGES >/dev/null; then
            echo "::error::REQUEST_INSTALL_PACKAGES must not be in the Play bundle"; exit 1
          fi
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        if: hashFiles('app/android/app/build/outputs/bundle/release/*.aab') != ''
        with:
          name: quidenous-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
      # Over-the-air updates (docs/OTA.md): the JS of this commit goes to the phones that already run a build with the
      # same native runtime (fingerprint read from the build itself). Dated like the build's embedded bundle, so a phone
      # that installs this very APK doesn't download it again. A changed fingerprint just starts a new runtime.
      - name: OTA runtimes
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          aab=app/build/outputs/bundle/release/app-release.aab
          commit_time() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(new Date(JSON.parse(s).commitTime).toISOString()))'; }
          echo "OTA_APK_RUNTIME=$(unzip -p $apk assets/fingerprint)" >> "$GITHUB_ENV"
          echo "OTA_APK_TIME=$(unzip -p $apk assets/app.manifest | commit_time)" >> "$GITHUB_ENV"
          if [ -f $aab ]; then
            echo "OTA_AAB_RUNTIME=$(unzip -p $aab base/assets/fingerprint)" >> "$GITHUB_ENV"
            echo "OTA_AAB_TIME=$(unzip -p $aab base/assets/app.manifest | commit_time)" >> "$GITHUB_ENV"
            # The two builds differ natively (install permission): the same runtime would send the APK's JS to Play.
            [ "$(unzip -p $apk assets/fingerprint)" != "$(unzip -p $aab base/assets/fingerprint)" ] || { echo "::error::APK and AAB share a runtime"; exit 1; }
          fi
          cat "$GITHUB_ENV" | grep OTA_
        working-directory: app/android
      - name: OTA update (APK)
        # Never blocks the APK release (server down or not yet deployed): the next push publishes again.
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') && env.UPDATES_PUBLISH_TOKEN != '' && env.OTA_APK_RUNTIME != ''
        env:
          EXPO_PUBLIC_DISTRIBUTION: sideload
          UPDATES_PUBLISH_TOKEN: ${{ secrets.UPDATES_PUBLISH_TOKEN }}
          UPDATES_PRIVATE_KEY: ${{ secrets.UPDATES_PRIVATE_KEY }}
        run: |
          npx expo export --platform android --clear --output-dir dist-ota-apk
          node scripts/ota-publish.mjs --dist dist-ota-apk --runtime "$OTA_APK_RUNTIME" --created-at "$OTA_APK_TIME"
      - name: OTA update (Play)
        continue-on-error: true
        if: startsWith(github.ref, 'refs/tags/v') && env.UPDATES_PUBLISH_TOKEN != '' && env.OTA_AAB_RUNTIME != ''
        env:
          UPDATES_PUBLISH_TOKEN: ${{ secrets.UPDATES_PUBLISH_TOKEN }}
          UPDATES_PRIVATE_KEY: ${{ secrets.UPDATES_PRIVATE_KEY }}
        run: |
          npx expo export --platform android --clear --output-dir dist-ota-play
          node scripts/ota-publish.mjs --dist dist-ota-play --runtime "$OTA_AAB_RUNTIME" --created-at "$OTA_AAB_TIME"
