name: android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - run: echo "EXPO_PUBLIC_API_URL=https://qdn.crabznetwork.com" >> "$GITHUB_ENV"
      - run: echo "EXPO_PUBLIC_JOIN_CODE=$JOIN_CODE" >> "$GITHUB_ENV"
        env:
          JOIN_CODE: ${{ secrets.JOIN_CODE }}
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: quidenous-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
