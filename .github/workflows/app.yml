name: app
# Type-checks the app (also catches a French string missing in English, docs/I18N.md) and looks for text translated at module load. A required check on main:
# it reports on every PR, and only does the work when the PR touches the app (`changes`).
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  # PRs only: does this PR touch the app? Pushes and tags skip it (always a full check), and an empty answer means
  # "check": only an explicit 'false' lets `app` stand down.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # The PR's changed files come from the API (no checkout).
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - "app/**"
              - ".github/workflows/app.yml"
  app:
    needs: changes
    # Always runs (`!cancelled()`: also when `changes` was skipped or failed), and a PR that doesn't touch the app
    # only skips the steps: the required check reports a success on any PR, never a skip (see server.yml's `check`).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Nothing to check
        if: needs.changes.outputs.app == 'false'
        # No checkout on this path, so not in app/.
        working-directory: ${{ runner.temp }}
        run: 'echo "::notice::No change under app/ or this workflow: nothing to check."'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.app != 'false'
        with:
          # Tag builds compare app.json with the previous tag.
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.app != 'false'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        if: needs.changes.outputs.app != 'false'
      - run: npx tsc --noEmit
        if: needs.changes.outputs.app != 'false'
      # A t() (or date/number format) computed when a module loads stays in the first language (docs/I18N.md).
      - name: No translation at module load
        if: needs.changes.outputs.app != 'false'
        run: node scripts/check-i18n-module-t.mjs
      # On a tag this job gates the OTA update: android.yml's `gate` waits for it (and server.yml's `check`) to be green.
      - name: Version matches the tag, versionCode goes up
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          field() { node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")).expo; console.log(process.argv[1]==="code" ? a.android.versionCode : a.version)' "$1"; }
          tag="${GITHUB_REF_NAME}"
          version=$(field version < app.json)
          code=$(field code < app.json)
          [ "v$version" = "$tag" ] || { echo "::error file=app/app.json::version $version does not match tag $tag"; exit 1; }
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then echo "no previous tag"; exit 0; fi
          prev_code=$(git show "$prev:app/app.json" | field code)
          echo "versionCode $code (previous tag $prev: $prev_code)"
          [ "$code" -gt "$prev_code" ] || { echo "::error file=app/app.json::versionCode $code must be greater than $prev_code ($prev)"; exit 1; }
