name: app
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            app:
              - "app/**"
              - "scripts/**"
              - "check"
              - ".github/workflows/app.yml"
              - "server/assets/**"
  app:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Nothing to check (this required job reports success, it is never skipped)
        if: needs.changes.outputs.app == 'false'
        working-directory: ${{ runner.temp }}
        run: 'echo "::notice::No change that the app checks depend on: nothing to check."'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.app != 'false'
        with:
          fetch-depth: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.app != 'false'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        if: needs.changes.outputs.app != 'false'
      - run: ../check app
        if: needs.changes.outputs.app != 'false'
      - name: Version matches the tag, versionCode goes up
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          field() { node -e 'const a=JSON.parse(require("fs").readFileSync(0,"utf8")).expo; console.log(process.argv[1]==="code" ? a.android.versionCode : a.version)' "$1"; }
          tag="${GITHUB_REF_NAME}"
          version=$(field version < app.json)
          code=$(field code < app.json)
          [ "v$version" = "$tag" ] || { echo "::error file=app/app.json::version $version does not match tag $tag"; exit 1; }
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -z "$prev" ]; then echo "no previous tag"; exit 0; fi
          prev_code=$(git show "$prev:app/app.json" | field code)
          echo "versionCode $code (previous tag $prev: $prev_code)"
          [ "$code" -gt "$prev_code" ] || { echo "::error file=app/app.json::versionCode $code must be greater than $prev_code ($prev)"; exit 1; }
