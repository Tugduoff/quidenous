allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
disallowed-methods = [
  { path = "std::env::var", reason = "declare the variable in platform::env and read it through its Var" },
  { path = "std::env::var_os", reason = "declare the variable in platform::env and read it through its Var" },
  { path = "std::env::temp_dir", reason = "a test takes its folder from common::temp_dir, which removes what finished runs left behind; the server writes under DATA_DIR" },
  { path = "sqlx::Pool::begin", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
  { path = "sqlx::Pool::begin_with", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
  { path = "sqlx::Pool::try_begin", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
  { path = "sqlx::Pool::try_begin_with", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
  { path = "sqlx::Connection::begin", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
  { path = "sqlx::Connection::begin_with", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
  { path = "sqlx::Acquire::begin", reason = "a transaction that writes starts with platform::db::write_tx (BEGIN IMMEDIATE), a snapshot that only reads with platform::db::read_tx: a deferred transaction that reads then writes fails at once with SQLITE_BUSY when another writer holds the lock, without waiting for busy_timeout" },
]
